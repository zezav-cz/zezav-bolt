name: Dagger Checks
on: [push]

jobs:
  checks:
    name: Dagger Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Call Dagger Checks
        uses: dagger/dagger-for-github@v8.3.0
        with:
          check: '**'
          version: 'v0.21.7'
  test:
    name: Dagger Test (rspec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Call Dagger Test
        uses: dagger/dagger-for-github@v8.3.0
        with:
          verb: call
          args: test
          version: 'v0.21.7'
