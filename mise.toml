[tools]
dagger = "0.19.11"
"go:github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker" = "3.6.1"
go = "1.25.5"
lefthook = "2.1.6"
prettier = "3.8.5"
ruby = "3.2.11"

[env]
BOLT_GEM = true

[tasks.fmt]
description = "Auto-fix puppet-lint issues and reformat YAML/JSON"
run = """
bundle exec puppet-lint . -f
prettier --write .
"""

[tasks.lint]
description = "Lint and syntax-validate puppet code, check formatting"
run = """
bundle exec puppet-lint .
bundle exec puppet parser validate manifests site
bundle exec puppet parser validate --tasks plans
prettier -c .
editorconfig-checker
"""

[tasks.ci]
description = "Run all checks (extend with test once specs exist — see TODO.md)"
run = "mise run lint"

[tasks.modules]
description = "Installs bolt modules"
run = "bundle exec bolt module install --force"
